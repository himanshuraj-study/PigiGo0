publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.4
  flutter_bloc: ^8.1.4
  go_router: ^13.2.0
  cached_network_image: ^3.3.1
